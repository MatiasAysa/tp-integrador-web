<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito</title>

    <!-- Otros links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../../css/globals/globalStyles.css">
    <link rel="stylesheet" href="../../css/globals/header.css">
    <link rel="stylesheet" href="../../css/globals/footer.css">
    <link rel="stylesheet" href="../../css/courses/metodoPago.css">
</head>

<body>
    <!------------------------------------ HEADER ------------------------------------>

    <!---------- BARRA DE LA PAGINA ---------->
    <header class="barra js-header">
    </header>
    <!------------------------------------------------>

    <!----------------NAVEGADOR------------------>
    <nav class="navbar js-nav">
    </nav>
    <!------------------------------------------------>

    <!------------------------------------ HEADER ------------------------------------>
    <main>
        <div class="main_titulo">
            <h1>Elegi como pagar <i class="fa-solid fa-hand-holding-dollar"></i></h1>
        </div>
        <div class="main_contenido">
            <form action="./resumenCompra.html" method="get" class="main_metodoPago">
                <h3>Selecciona un metodo de pago</h3>
                <div class="metodoPago_Opciones">
                    <section class="metodo_opcion">
                        <input type="radio" name="metodo-pago" id="visa1" required>
                        <label for="visa1">
                            <i class="fa-brands fa-cc-visa"></i>
                            Visa terminada en 4512
                        </label>
                    </section>
                    <section class="metodo_opcion">
                        <input type="radio" name="metodo-pago" id="mastercard" required>
                        <label for="mastercard">
                            <i class="fa-brands fa-cc-mastercard"></i>
                            Mastercard terminada en 4512
                        </label>
                    </section>
                </div>
                <a href="../account-stuff/tarjetas.html" class="boton_agregar">
                    Agregar Metodo de Pago
                </a>
                <button type="submit" class="boton_pagar">
                    <i class="fa-solid fa-lock"></i>
                    Continuar con el pago
                </button>
            </form>

            <div class="main_montoTotal">
                <h3>Resumen de compra</h3>
                <div class="montoTotal_Descripcion">
                    <div class="montoTotal_elemento">
                        <span>Cantidad de producto/s</span>
                        <span>3</span>
                    </div>
                    <div class="montoTotal_elemento total">
                        <span>Pagas</span>
                        <span>$10000</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!------------------------------------ FOOTER ------------------------------------>
    <footer class="pie-pagina">

    </footer>
    <!------------------------------------ FOOTER ------------------------------------>
    
    <script src="../../js/components/menuNav-module.js" type="module"></script>
</body>

</html>
