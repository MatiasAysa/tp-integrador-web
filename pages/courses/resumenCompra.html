<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito</title>

    <!-- Otros links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../../css/globals/globalStyles.css">
    <link rel="stylesheet" href="../../css/globals/header.css">
    <link rel="stylesheet" href="../../css/globals/footer.css">
    <link rel="stylesheet" href="../../css/courses/resumenCompra.css">
    <link rel="stylesheet" href="../../css/courses/succes-compraRealizada.css">
    <link rel="stylesheet" href="../../css/globals/modal.css">
</head>

<body>
    <!------------------------------------ HEADER ------------------------------------>

    <!---------- BARRA DE LA PAGINA ---------->
    <header class="barra js-header">
    </header>
    <!------------------------------------------------>

    <!----------------NAVEGADOR------------------>
    <nav class="navbar js-nav">
    </nav>
    <!------------------------------------------------>
    <!------------------------------------ HEADER ------------------------------------>
    <main>
        <div class="main_titulo">
            <h1>Revisa y confirma tu compra</h1>
        </div>
        <div class="main_contenido js-contenedorPadre">
            <div class="main_informacion">
                <div class="detalle_compra">
                    <h3>Detalle de compra</h3>
                    <div class="detalle_compra_info js-detalleCompra">
                        <!-- Contenido generado por JS -->
                    </div>
                </div>

                <div class="detalle_pago">
                    <h3>Detalle metodo de pago</h3>
                    <div class="detalle_pago_info">
                        <section class="metodo_pago">
                            <article class="pago_imagen">
                                <img src="../../img/metodosPago/mastercard.svg" alt="Curso Java">
                            </article>
                            <article class="pago_informacion">
                                <p class="item item1">Mastercard</p>
                                <p class="item item2">Tarjeta terminada en 4576</p>
                            </article>
                        </section>
                    </div>
                </div>

            </div>
            <div class="main_montoTotal">
                <h3>Resumen de compra</h3>
                <div class="montoTotal_Descripcion">
                    <div class="montoTotal_elemento">
                        <span >Cantidad de producto/s</span>
                        <span class="js-cantCursos"></span>
                    </div>
                    <div class="montoTotal_elemento total">
                        <span>Pagas</span>
                        <span class="js-totalPrecio"></span>
                    </div>
                    <div class="montoTotal_elementoComprar">
                        <button class="js-realizarCompra">Realizar compra</button>
                    </div>
                </div>
            </div>
        </div>
        <dialog class="js-mainCompra">
            <div class="mainCompra">
                <div class="main_confirmacion">
                    <div class="confirmacion_exito">
                        <div class="exito_circulo">
                            <i class="fa-solid fa-check"></i>
                        </div>
                    </div>

                    <div class="confirmacion_mensaje">
                        <h2>¡Pago exitoso!</h2>
                        <p>Tu compra se realizó correctamente</p>
                        <p class="numero_orden">Nº de orden: <strong>#TQ789456</strong></p>
                    </div>

                    <div class="confirmacion_boton">
                        <a href="../../pages/courses/myCourses.html" class="btn-primario">
                            <i class="fa-solid fa-book"></i>
                            Ver mis cursos
                        </a>
                        <a href="../../pages/homePage/homePage.html" class="btn-secundario">
                            <i class="fa-solid fa-home"></i>
                            Volver al inicio
                        </a>
                    </div>
                </div>
            </div>
        </dialog>
    </main>
    <!------------------------------------ FOOTER ------------------------------------>
    <footer class="pie-pagina">

    </footer>
    <!------------------------------------ FOOTER ------------------------------------>
    <script src="../../js/pages/compras/resumenCompra.js" type="module"></script>
    <script src="../../js/components/menuNav-module.js" type="module"></script>

</body>

</html>
