<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles Del Curso</title>
    <link rel="stylesheet" href="../../css/courses/course-details.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/globals/globalStyles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../css/globals/header.css">
    <link rel="stylesheet" href="../../css/globals/footer.css">
</head>

<body>
    <!------------------------------------ HEADER ------------------------------------>

    <header class="barra js-header">
    </header>
    <nav class="navbar js-nav">
    </nav>
    <!------------------------------------ HEADER ------------------------------------>
    <main>
        <section>
            <section class="contenedoresPresentacion">
                <div class="contenedorImagen">
                    <img src="" alt="Imagen de Curso HTML y CSS"
                        class="contenedorImagen__imagenCurso" id="imagenCurso-js">
                    <div class="contenedorImagen__textoPresentacion">
                        <h2 id="nivelCurso-js" class="subtitulo"></h2>
                        <h1 id="nombreCurso-js" class="titulo"></h1>
                    </div>
                </div>

                <div class="contenedorTexto">
                    <div class="contenedorTexto__duracionCurso">
                        <h2>Duracion del Curso:</h2>
                        <p id="duracionCurso-js"></p>
                    </div>
                    <div class="contenedorTexto__modalidadCurso">
                        <h2>Modalidad:</h2>
                        <p id="modalidadCurso-js"></p>
                    </div>
                    <div class="contenedorTexto__descripcionCurso">
                        <h2>Descripcion:</h2>
                        <p id="descripcionCurso-js"></p>
                    </div>
                    <div class="contenedorTexto__VerPrograma">
                        <a href="#seccionPrograma"><button name="VerPrograma" id="VerPrograma" class="boton">Ver
                                Programa</button></a>
                    </div>
                    <div class="contenedorCompra">
                        <div class="flex-row">
                            <h2>Valor Del curso: <span id="precioCurso-js"></span></h2>
                        </div>
                        <button name="inscribirme" id="inscribirme" class="boton"> inscribirme</button>
                    </div>
                </div>

            </section>
            <section class="contenedoresInfo">
                <section class="contenedoresInfo__infoPrincipal">
                    <div class="objetivo">
                        <div class="tituloInfo">
                            <h1> Objetivos de la Cursada</h1>
                        </div>
                        <div class="objetivo__texto">
                            <div class="objetivo__lista">
                                <ul id="objetivosCurso-js">

                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="tituloInfo" name="seccionPrograma" id="seccionPrograma">
                        <h1>Programa Educativo</h1>
                        <div class="programaEdu">
                            <div class="programa__niveles">
                                <div class="niveles__divide">
                                    <h2 class="niveles__divide--numNivel">nivel 1</h2>
                                </div>
                                <div class="niveles__divide">
                                    <div class="niveles__divide--column">
                                        <div class="niveles__divide--column-1">
                                            <h3>Primer <br> Cuatrimestre</h3>
                                        </div>
                                    </div>
                                    <div class="niveles__divide--column">
                                        <div class="niveles__divide--column-2">
                                            <ul class="cuatrimestresCurso">

                                            </ul>
                                        </div>
                                    </div>
                                </div>
                                <div class="niveles__divide">
                                    <div class="niveles__divide--column">
                                        <div class="niveles__divide--column-1">
                                            <h3>Segundo <br> Cuatrimestre</h3>
                                        </div>
                                    </div>
                                    <div class="niveles__divide--column">
                                        <div class="niveles__divide--column-2">
                                            <ul class="cuatrimestresCurso">

                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="programa__niveles">
                                <div class="niveles__divide">
                                    <h2 class="niveles__divide--numNivel">nivel 2</h2>
                                </div>
                                <div class="niveles__divide">
                                    <div class="niveles__divide--column">
                                        <div class="niveles__divide--column-1">
                                            <h3>Tercer <br> Cuatrimestre</h3>
                                        </div>
                                    </div>
                                    <div class="niveles__divide--column">
                                        <div class="niveles__divide--column-2">
                                            <ul class="cuatrimestresCurso">

                                            </ul>
                                        </div>
                                    </div>
                                </div>
                                <div class="niveles__divide">
                                    <div class="niveles__divide--column">
                                        <div class="niveles__divide--column-1">
                                            <h3>Cuarto <br> Cuatrimestre</h3>
                                        </div>
                                    </div>
                                    <div class="niveles__divide--column">
                                        <div class="niveles__divide--column-2">
                                            <ul class="cuatrimestresCurso">

                                            </ul>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </section>
                <aside class="contenedoresInfo__infoSecundaria">
                </aside>

            </section>
        </section>

    </main>
    <!------------------------------------ FOOTER ------------------------------------>
    <footer class="pie-pagina">

    </footer>
    <!------------------------------------ FOOTER ------------------------------------>

    <!------------------------------------ JScript ----------------------------------->
    <script src="../../js/components/menuNav-module.js" type="module"></script>
    <script src="../../js/pages/courses/detallesCurso-module.js" type="module"></script>
    <!------------------------------------ JScript -----------------------------------> 
</body>

</html>
