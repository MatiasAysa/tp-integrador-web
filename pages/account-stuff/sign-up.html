<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>

    <!-- Otros links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../../css/globals/globalStyles.css">
    <link rel="stylesheet" href="../../css/globals/header.css">
    <link rel="stylesheet" href="../../css/globals/footer.css">
    <link rel="stylesheet" href="../../css/account-stuff/log-in.css">
    <link rel="stylesheet" href="../../css/account-stuff/sign-up.css">

</head>

<body>

    <!------------------------------------ HEADER ------------------------------------>

    <!---------- BARRA DE LA PAGINA ---------->
    <header class="barra js-header">
    </header>
    <!------------------------------------------------>

    <!----------------NAVEGADOR------------------>
    <nav class="navbar js-nav">
    </nav>
    <!------------------------------------------------>

    <!------------------------------------ HEADER ------------------------------------>



    <!------------------------------------ CONTENIDO DE LA PAGINA ------------------------------------>

    <main>
        <section class="formWrap">
            <form class="formWrap__form form" action="#" method="get">

                <div class="form__field">
                    <label class="form__label" for="email">Ingresa tu e-mail</label>
                    <input class="form__input" type="email" id="email" name="email">
                </div>

                <div class="form__field">
                    <label class="form__label" for="name">Ingresa tu nombre</label>
                    <input class="form__input" type="text" id="name" name="name" required>
                </div>

                <div class="form__field">
                    <label class="form__label" for="surname">Ingresa tu apellido </label>
                    <input class="form__input" type="text" id="surname" name="surname" required>
                </div>

                <div class="form__field">
                    <label class="form__label" for="dni">Ingresa tu DNI (sin puntos)</label>
                    <input class="form__input form__input--number" type="text" id="dni" name="dni" maxlength="10" required>
                </div>

                <div class="form__field">
                    <label class="form__label" for="username">Ingresa un nombre de usuario</label>
                    <input class="form__input" type="text" id="username" name="username" maxlength="40"required>
                </div>

                <div class="form__field">
                    <label class="form__label" for="password">Ingresa una contraseña</label>
                    <input class="form__input" type="password" id="password" name="password" minlength="8"
                        maxlength="20"required>
                </div>

                <button class="form__button">CONTINUAR</button>
                <p class="formWrap__p">¿Ya tienes una cuenta? <a href="./log-in.html" class="formWrap__a">INICIAR
                        SESIÓN</a></p>
            </form>
        </section>
    </main>

    <!------------------------------------ CONTENIDO DE LA PAGINA ------------------------------------>



    <!------------------------------------ FOOTER ------------------------------------>
    <footer class="pie-pagina">

    </footer>
    <!------------------------------------ FOOTER ------------------------------------>

    <script src="../../js/components/menuNav-module.js" type="module"></script>
    <script src="../../js/pages/account-stuff/signUp-module.js" type="module"></script>
</body>

</html>
