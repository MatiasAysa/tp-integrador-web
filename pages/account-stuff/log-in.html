<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>

    <!-- Otros links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../../css/globals/globalStyles.css">
    <link rel="stylesheet" href="../../css/globals/header.css">
    <link rel="stylesheet" href="../../css/globals/modal.css">
    <link rel="stylesheet" href="../../css/globals/footer.css">

<body>

    <!------------------------------------ HEADER ------------------------------------>

    <!---------- BARRA DE LA PAGINA ---------->
    <header class="barra js-header">
    </header>
    <!------------------------------------------------>

    <!----------------NAVEGADOR------------------>
    <nav class="navbar js-nav">
    </nav>
    <!------------------------------------------------>

    <!------------------------------------ HEADER ------------------------------------>



    <!------------------------------------ CONTENIDO DE LA PAGINA ------------------------------------>

    <main>
        <section class="formWrap">
            <form class="formWrap__form form" action="../homePage/homePage.html" method="get">

                <div class="form__field">
                    <label class="form__label" for="email">E-mail</label>
                    <input class="form__input" type="email" id="email" name="email" maxlength="40" required>
                </div>

                <div class="form__field">
                    <label class="form__label" for="password">Contraseña</label>
                    <input class="form__input" type="password" id="password" name="password" maxlength="20" required>
                </div>
                <a href="../homePage/homePage.html">
                    <button class="form__button">CONTINUAR</button>
                </a>
                <p class="formWrap__p">¿No tienes cuenta? <a href="./sign-up.html" class="formWrap__a">CREAR</a>
                </p>
            </form>
        </section>
    </main>

    <!------------------------------------ CONTENIDO DE LA PAGINA ------------------------------------>



    <!------------------------------------ FOOTER ------------------------------------>
    <footer class="pie-pagina">

    </footer>
    <!------------------------------------ FOOTER ------------------------------------>

    <script src="../../js/components/menuNav-module.js" type="module"></script>
