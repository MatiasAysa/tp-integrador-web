<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar tarjeta</title>

    <!-- Otros links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../../css/globals/globalStyles.css">
    <link rel="stylesheet" href="../../css/globals/header.css">
    <link rel="stylesheet" href="../../css/globals/footer.css">
    <link rel="stylesheet" href="../../css/account-stuff/tarjetas.css">

</head>

<body>
    <!------------------------------------ HEADER ------------------------------------>

    <!---------- BARRA DE LA PAGINA ---------->
    <header class="barra js-header">
    </header>
    <!----------------NAVEGADOR------------------>
    <nav class="navbar js-nav">
    </nav>
    <!------------------------------------ HEADER ------------------------------------>
    <!------------------------------------ CONTENIDO DE LA PAGINA ------------------------------------>

    <main class="contenido">

        <form action="./succes-tarjeta.html" method="get" class="formWrap js-form">

            <section class="formWrap__form">

                <h2>INFORMACIÓN DE LA TARJETA</h2>

                <div class="form__field">
                    <label class="form__label" for="tipo">Tipo</label>
                    <select class="form__input js-select" id="tipo">
                        <option value="visa">Visa</option>
                        <option value="mastercard">Mastercard</option>
                    </select>
                </div>

                <div class="form__field">
                    <label class="form__label" for="numero">Número de Tarjeta</label>
                    <input class="form__input js-numTarjeta" type="text" id="numero" name="numero" maxlength="16" required>
                </div>

                <div class="form__field">
                    <label class="form__label" for="cvv">Código de Seguridad (CVV)</label>
                    <input class="form__input form__input--small js-cod" type="password" id="cvv" name="cvv" maxlength="3"
                        required>
                </div>

                <div class="form__field">
                    <label class="form__label" for="vencimiento">Fecha de Vencimiento (MM/AA)</label>
                    <input class="form__input form__input--date js-vencimiento" type="text" id="vencimiento" name="vencimiento"
                        placeholder="MM/AA" maxlength="5" required>
                </div>

            </section>

            <section class="formWrap__form">

                <h2>INFORMACIÓN DE FACTURACIÓN</h2>

                <div class="form__field">
                    <label class="form__label" for="direccion">Dirección</label>
                    <input class="form__input" type="text" id="direccion" name="direccion" required>
                </div>

                <div class="form__field">
                    <label class="form__label" for="cvv">Código postal</label>
                    <input class="form__input form__input--small" type="text" id="cp" name="cp" maxlength="4"
                        required>
                </div>

                <div class="form__field">
                    <label class="form__label" for="nombre">Nombre del titular</label>
                    <input class="form__input" type="text" id="name" name="nombre" required>
                </div>

                <div class="form__field">
                    <label class="form__label" for="nombre">Apellido del titular</label>
                    <input class="form__input" type="text" id="surname" name="nombre" required>
                </div>

                <button type="submit" class="form__button">CONTINUAR</button>

            </section>

        </form>

    </main>

    <!------------------------------------ CONTENIDO DE LA PAGINA ------------------------------------>


    <!------------------------------------ FOOTER ------------------------------------>
    <footer class="pie-pagina">

    </footer>
    <!------------------------------------ FOOTER ------------------------------------>

    <script src="../../js/components/menuNav-module.js" type="module"></script>
    <script src="../../js/pages/account-stuff/tarjetas-module.js" type="module"></script>

</body>

</html>
